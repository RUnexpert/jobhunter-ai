# Isolated ephemeral services for integration tests. Never use a production database.
services:
  test-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobhunter_test
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter_test_password
    ports: ['127.0.0.1:55432:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U jobhunter -d jobhunter_test']
      interval: 2s
      timeout: 3s
      retries: 20
  test-redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56379:6379']
    tmpfs: [/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
